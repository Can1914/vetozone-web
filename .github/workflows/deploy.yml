name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # vetozone.com.tr şimdilik "çok yakında" sayfasını gösteriyor. Tam site
  # GitHub Pages'te geliştirilmeye devam ediyor (aşağıdaki iş).
  hosting:
    name: Holding page to hosting
    runs-on: ubuntu-latest
    # İki yükleme aynı anda aynı FTP ağacına yazmasın.
    concurrency:
      group: ftp-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Holding sayfası React'a ihtiyaç duymuyor; paket düz kopyalamayla
      # hazırlanıyor, bu yüzden bu iş npm kurmadan saniyeler içinde biter.
      - name: Assemble the holding page
        run: sh scripts/build-landing.sh

      # Düz FTP bu sunucuda veri bağlantılarını düşürüyordu (ECONNRESET);
      # FTPS veri kanalını şifrelediği için kesilmiyor, `loose` ise bu
      # sunucuların sertifika uyuşmazlığını kabul ediyor. Başarısız olmasına
      # izin veriliyor ki aşağıdaki lftp yedeği aynı koşuda devralabilsin.
      - name: Upload over FTPS
        id: ftps
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 60000
          state-name: .vetozone-deploy-state.json
          # FTP hesabı zaten site klasörüne açılıyor.
          local-dir: ./landing-dist/
          server-dir: ./
          # Yalnızca landing-dist yükleniyor; backend, tests ve memory
          # klasörleri senkronize edilen ağacın içinde olmadığı için
          # sunucuya hiçbir koşulda ulaşamaz.
          #
          # Buradakilere dokunulmuyor: eşleme sırasında atlandıkları için ne
          # yüklenir ne de silinirler. Bu liste olmasaydı, yerelde karşılığı
          # bulunmayan sunucu dosyaları silinirdi.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .cl.selector/**
            .cagefs/**
            **/.cl.selector/**
            **/.cagefs/**
            .well-known/**
            **/.well-known/**
            mail-config.php
            **/mail-config.php

      # Bağlantı aktarım ortasında yine kopuyorsa: lftp iptal etmek yerine
      # yeniden bağlanıp kaldığı yerden devam eder, tek veri bağlantısı
      # kullanır ve yalnızca değişen dosyaları gönderir.
      - name: Install lftp
        if: steps.ftps.outcome == 'failure'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload over FTPS with lftp
        if: steps.ftps.outcome == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          # Şifre argüman listesine düşmesin diye ortamdan okunuyor.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          set ftp:passive-mode true;
          set net:max-retries 10;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-multiplier 1;
          set net:timeout 20;
          set xfer:clobber on;
          open -u '$FTP_USERNAME' --env-password '$FTP_SERVER';
          mirror --reverse --only-newer --parallel=1 --delete --verbose --exclude-glob .cl.selector/ --exclude-glob .cagefs/ --exclude-glob .well-known/ --exclude-glob mail-config.php ./landing-dist/ ./;
          bye
          "

  # Tam site: can1914.github.io/vetozone-web — müşteriye gösterilen ve
  # üzerinde çalışmaya devam ettiğimiz adres.
  pages:
    name: Full site to GitHub Pages
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Bağımlılık ağacı yalnızca legacy peer çözümlemesiyle kuruluyor;
      # package-lock.json da böyle üretildi. postinstall ajv ayrışmasını
      # yamalıyor (frontend/scripts/fix-legacy-ajv-keywords.js).
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # build:host'tan farkı: PUBLIC_URL'i / yapmıyor, package.json'daki
      # homepage'i kullanıyor — Pages alt dizinde (/vetozone-web) servis
      # edildiği için varlık yolları buna göre üretilmeli.
      - name: Build
        working-directory: frontend
        run: npm run build

      # Pages statik dosya sunar, React Router'ın yolları gerçek dosya
      # değildir. 404 sayfası index.html'in kopyası olunca doğrudan açılan
      # /tedavi-alanlari gibi adresler uygulamaya düşüyor.
      - name: Route deep links through the app
        working-directory: frontend
        run: cp build/index.html build/404.html

      - name: Publish to the gh-pages branch
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes gh-pages@6 \
            --dist build \
            --user "github-actions <github-actions@github.com>" \
            --message "Deploy ${GITHUB_SHA}" \
            --repo "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
